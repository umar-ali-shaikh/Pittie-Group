<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 999;
        background: transparent;
      }

      .navbar {
        padding: 22px 24px;
      }

      .main-navigation .container {
        max-width: 100%;
        width: calc(100% - 32px);
        min-height: 72px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 42px 0 38px;

        border-radius: 16px;

        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(35px);
        -webkit-backdrop-filter: blur(35px);

        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.75);

        border: 1px solid rgba(255, 255, 255, 0.45);
      }

      /* Logo */
      .custom-logo-link {
        display: flex;
        align-items: center;
        padding: 0;
        background: transparent !important;
      }

      .main-navigation .custom-logo-link img {
        width: 92px;
        height: auto;
        display: block;
      }

      /* Menu */
      .menu-main-container {
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        padding: 0;
      }

      .main-navigation ul {
        display: flex;
        align-items: center;
        gap: 36px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .menu-main-container li {
        margin: 0;
        list-style: none;
        text-transform: none;
      }

      .menu-main-container li a {
        position: relative;
        color: #0b376d;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0;
        text-decoration: none;
        padding: 26px 0;
        line-height: 1;
      }

      .menu-main-container li a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 19px;
        width: 0;
        height: 2px;
        background: #0059cf;
        border-radius: 20px;
        transition: 0.3s ease;
      }

      .menu-main-container li.active > a::after,
      .menu-main-container li:hover > a::after {
        width: 100%;
      }

      .menu-main-container li.active > a,
      .menu-main-container li:hover > a {
        color: #0059cf;
      }

      /* Dropdown arrow */
      .arrow-down > a::after {
        content: "⌄";
        position: static;
        width: auto;
        height: auto;
        margin-left: 6px;
        background: none;
        font-size: 12px;
        vertical-align: middle;
      }

      /* Dropdown */
      .main-navigation ul ul.sub-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 210px;
        padding: 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      }

      .main-navigation ul li:hover > ul.sub-menu {
        display: flex;
        flex-direction: column;
      }

      .sub-menu li a {
        padding: 10px 12px;
        font-size: 13px;
        color: #0b376d;
      }

      .sub-menu li a:hover {
        background: #0059cf;
        color: #fff;
        border-radius: 8px;
      }

      /* Ask AI */
      .search-icon-wrap {
        padding: 0;
        background: transparent;
        border: 0;
        box-shadow: none;
      }

      header #btn-search {
        width: 118px;
        height: 48px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        border: 1px solid rgba(140, 148, 171, 0.25);
        border-radius: 12px;

        background:
          linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.4),
            rgba(255, 255, 255, 0.4)
          ),
          linear-gradient(
            25.61deg,
            rgba(0, 89, 207, 0) 29.07%,
            rgba(0, 89, 207, 0.1) 94.36%
          ),
          linear-gradient(
            59.96deg,
            rgba(0, 89, 207, 0.2) 10.06%,
            rgba(0, 89, 207, 0) 50.1%
          );

        box-shadow:
          0 8px 20px rgba(0, 89, 207, 0.12),
          inset 0 1px 2px rgba(255, 255, 255, 0.65);

        cursor: pointer;
      }

      .search-btn .search-icon {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
      }

      .search-btn .text {
        font-size: 16px;
        font-weight: 500;
        margin: 0 !important;

        background: linear-gradient(135deg, #0059cf 0%, #111928 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Hide mobile Ask AI inside menu on desktop */
      .search-icon-wrap-mb {
        display: none;
      }

      /* Mobile */
      @media (max-width: 991px) {
        .menu-toggle {
          display: block;
        }

        .menu-main-container {
          position: absolute;
          top: 90px;
          left: 24px;
          right: 24px;
          background: rgba(255, 255, 255, 0.95);
          border-radius: 18px;
          padding: 20px;
        }

        .main-navigation ul {
          flex-direction: column;
          gap: 18px;
          align-items: flex-start;
        }

        .search-icon-wrap-pc {
          display: none;
        }

        .search-icon-wrap-mb {
          display: block;
        }
      }
    </style>
  </head>

              <div class="search-icon-wrap search-icon-wrap-mb">
                <button

          <!-- Right Ask AI -->
          <div class="search-icon-wrap search-icon-wrap-pc">
            <button

              <img
                src="assets/homePage/search-icon-ai-new.svg"
